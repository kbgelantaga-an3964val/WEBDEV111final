<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        :root {
            --bg-dark: #fdfaf3;     
            --header-olive: #6e8c69;
            --card-bg: #5a7356;
            --primary-gold: #ffd700;
            --accent-purple: #4a307d;
            --text-white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            overflow: hidden;
        }

      
        header {
            background-color: var(--header-olive);
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #3d4d22;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-white);
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            text-transform: capitalize;
        }

    
        .main-content {
            display: flex;
            height: calc(100vh - 70px); /* Adjust for header height */
        }

        
        .left-side {
            width: 400px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            overflow-y: auto;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .glass-panel {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        h2 { margin-top: 0; color: var(--primary-gold); }

        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #ccc; }
        
        input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .btn-gold {
            background: var(--primary-gold);
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-gold:hover { transform: translateY(-2px); }

        .admin-access { text-align: center; }
        .admin-btns { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        
        .btn-purple {
            background: var(--accent-purple);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }

    
        .right-side {
            flex: 1;
            position: relative;
            background: #000;
        }

        .slider {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .slides {
            display: flex;
            width: 300%; /* Number of images * 100% */
            height: 100%;
            transition: transform 0.8s ease-in-out;
        }

        .slide {
            width: 33.33%;
            height: 100%;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
        }

        .slider-overlay {
            position: absolute;
            bottom: 40px;
            left: 40px;
            z-index: 10;
        }

        .slider-overlay h1 {
            font-size: 3rem;
            margin: 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Boodle King</div>
        <nav>
            <a href="dashboard.html">Home</a>
            <a href="about.html">About</a>
            <a href="menu.html">Menu</a>
            <a href="order.html">Order</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <div class="main-content">
       
        <div class="left-side">
            <div class="glass-panel">
                <h2>Sign In</h2>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password">
                </div>
                <button class="btn-gold" onclick="location.href='admin.html'">Sign In</button>
                <p style="text-align: center; font-size: 0.8rem; margin-top: 15px;">
                 
                </p>
            </div>

            <div class="glass-panel admin-access">
                <p style="color: #888; font-size: 0.7rem; letter-spacing: 2px;">ADMIN POINT</p>
                <div class="admin-btns">
                    <a href="admin.html" class="btn-purple">Admin</a>
                    <a href="superadmin.html" class="btn-purple">SuperAdmin</a>
                </div>
            </div>
        </div>

      
        <div class="right-side">
            <div class="slider">
                <div class="slides" id="slideRow">
                
                    <div class="slide"><img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=1200" alt="Boodle Feast"></div>
                    <div class="slide"><img src="https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1200" alt="Grilled Meat"></div>
                    <div class="slide"><img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=1200" alt="Fresh Platter"></div>
                </div>
            </div>
            <div class="slider-overlay">
                <h1>Feast Like a King.</h1>
                <p>Experience the ultimate boodle fight experience.</p>
            </div>
        </div>
    </div>

    <script>
    
        let counter = 0;
        const slideRow = document.getElementById('slideRow');
        const totalSlides = 3;

        setInterval(() => {
            counter++;
            if (counter >= totalSlides) {
                counter = 0;
            }
            slideRow.style.transform = `translateX(${-counter * 33.33}%)`;
        }, 4000);
    </script>

</body>
</html>
